# Builds the demo app and publishes it on GitHub Pages after every push to main.
name: Deploy demo app to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# Read the code, publish to Pages, and prove the run's identity to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a running deployment is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci
      - run: npx ng build fhir-vitals
      # Pages serves the app below /<repository>/, so Angular needs that base href.
      - run: npx ng build demo-app --base-href "$BASE_PATH/"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      # No FHIR server on Pages, so a public page never sends requests to the visitor's localhost.
      - run: |
          echo '{ "fhirBaseUrl": null }' > dist/demo-app/browser/config.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/demo-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
