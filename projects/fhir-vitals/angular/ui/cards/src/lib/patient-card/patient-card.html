<mat-card appearance="outlined">
  <mat-card-header>
    <h2 mat-card-title>Patient</h2>
  </mat-card-header>
  <mat-card-content>
    <dl>
      <dt>Name</dt>
      <dd>{{ patient()?.name?.[0]?.text ?? "–" }}</dd>
      <dt>Geschlecht</dt>
      <dd>{{ patient()?.gender ?? "–" }}</dd>
      <dt>Geburtsdatum</dt>
      <dd>{{ patient()?.birthDate ?? "–" }}</dd>
      <dt>Kennung</dt>
      <dd>{{ patient()?.identifier?.[0]?.value ?? "–" }}</dd>
    </dl>
  </mat-card-content>
</mat-card>
