<header>
  <mat-toolbar>
    <h1>FHIR-Starter</h1>
  </mat-toolbar>
</header>

<main>
  <p>
    Diese Seite zeigt, wie eine App die Bibliothek fhir-vitals nutzt. Angular
    Material, gridstack und Chart.js sind ein Vorschlag und lassen sich
    austauschen.
  </p>

  <div class="cards">
    <lib-patient-card [patient]="vitals.state().patient" />
    <lib-server-status
      [state]="vitals.state()"
      (reconnect)="vitals.reconnect()"
    />
  </div>

  <h2>Dashboard</h2>
  <p>Minimales Beispiel mit einer festen Kachel.</p>
  @defer (on viewport) {
    <lib-vitals-dashboard [history]="vitals.state().history" />
  } @placeholder {
    <p>Dashboard wird geladen …</p>
  }
</main>
